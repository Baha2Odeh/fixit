name: Release

# Builds installers for macOS (Apple Silicon + Intel) and Windows and attaches
# them to a DRAFT GitHub release. Review the draft, then publish it.
#
# Trigger: push a tag like v0.1.0 (it should match "version" in
# src-tauri/tauri.conf.json), or run it manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac targets are installed so one runner can build either.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ is replaced with the version from tauri.conf.json.
          tagName: v__VERSION__
          releaseName: Fixit v__VERSION__
          releaseBody: See the README for install notes (unsigned builds need one extra step on macOS and Windows).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
