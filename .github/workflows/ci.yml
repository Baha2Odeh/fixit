name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the point: it compiles and tests the Windows-only code paths
    # that can't be checked on a Mac.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      # Type-checks the UI and produces dist/, which the Tauri build embeds.
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri
