[package]
name = "fixit"
version = "0.1.1"
description = "Hotkey grammar fixer using your own AI API key"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fixit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Simulates Cmd/Ctrl+C and Cmd/Ctrl+V in the focused app.
enigo = "0.5"
# API keys go in the OS keychain. Without these features keyring silently
# falls back to an in-memory mock store.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# rustls instead of native-tls: no OpenSSL dependency on any platform.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }


[target.'cfg(target_os = "macos")'.dependencies]
# Used for the Accessibility permission prompt (already in the tree via tauri).
core-foundation = "0.10"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
